<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quest Quiz – complete missões e ganhe pontos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Quest Quiz</h1>
  <div class="score" aria-live="polite">
    <div class="rank"><span id="rank">Aprendiz</span> · <strong id="points">0</strong> pts</div>
    <div class="bar" role="progressbar" aria-label="Progresso até o próximo nível"><i id="bar"></i></div>
    <small id="next"></small>
  </div>
</header>
<main id="app"></main>
<footer><button id="reset" class="link">Zerar progresso</button></footer>
<script src="script.js"></script>
</body>
</html>
